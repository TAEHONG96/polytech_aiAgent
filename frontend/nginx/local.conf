map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

limit_req_zone $binary_remote_addr zone=signin:1m rate=12r/m;
limit_req_zone $binary_remote_addr zone=training_signup:1m rate=3r/m;

server {
    listen 80;
    server_name localhost;
    access_log /var/log/nginx/access.log polytech;
    server_tokens off;
    client_max_body_size 128k;
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $api http://api:8000;
    set $vite http://frontend:5173;
    include /etc/nginx/polytech/request-errors.conf;

    location = /health { include /etc/nginx/polytech/proxy.conf; }
    location = /api/v1/ready { return 404; }
    location = /api/v1/auth/login {
        limit_req zone=signin burst=10 nodelay;
        limit_req_status 429;
        include /etc/nginx/polytech/proxy.conf;
    }
    location = /api/v1/auth/register {
        limit_req zone=training_signup burst=3 nodelay;
        limit_req_status 429;
        error_page 413 = @request_too_large;
        error_page 429 = @training_signup_rate_limit;
        include /etc/nginx/polytech/proxy.conf;
    }
    location @training_signup_rate_limit {
        default_type application/json;
        add_header X-Request-ID $request_id always;
        return 429 '{"error":{"code":"REGISTER_RATE_LIMIT","message":"가입 요청이 많습니다. 잠시 후 다시 시도하세요.","details":null,"request_id":"$request_id"}}';
    }
    location = /api/v1/sops {
        client_max_body_size 8m;
        include /etc/nginx/polytech/proxy.conf;
    }
    location /api/ { include /etc/nginx/polytech/proxy.conf; }
    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass $vite;
    }
}
