# The origin has no host port. Cloudflare supplies the client IP via cloudflared.
map $http_cf_connecting_ip $signin_client {
    "" $remote_addr;
    default $http_cf_connecting_ip;
}

limit_req_zone $signin_client zone=signin:1m rate=12r/m;

server {
    listen 80;
    server_name _;
    server_tokens off;
    include /etc/nginx/polytech/static.conf;
}
