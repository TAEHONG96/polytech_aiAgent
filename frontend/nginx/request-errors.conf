error_page 413 = @request_too_large;
error_page 429 = @signin_rate_limit;

location @request_too_large {
    default_type application/json;
    add_header X-Request-ID $request_id always;
    return 413 '{"error":{"code":"REQUEST_TOO_LARGE","message":"요청 크기 제한을 초과했습니다.","details":null,"request_id":"$request_id"}}';
}

location @signin_rate_limit {
    default_type application/json;
    add_header X-Request-ID $request_id always;
    return 429 '{"error":{"code":"SIGNIN_RATE_LIMIT","message":"로그인 요청이 많습니다. 잠시 후 다시 시도하세요.","details":null,"request_id":"$request_id"}}';
}
