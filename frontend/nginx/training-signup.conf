location = /api/v1/auth/register {
    limit_req zone=training_signup burst=3 nodelay;
    limit_req_status 429;
    error_page 413 = @request_too_large;
    error_page 429 = @training_signup_rate_limit;
    include /etc/nginx/polytech/proxy.conf;
}

location @training_signup_rate_limit {
    default_type application/json;
    add_header X-Request-ID $request_id always;
    return 429 '{"error":{"code":"REGISTER_RATE_LIMIT","message":"가입 요청이 많습니다. 잠시 후 다시 시도하세요.","details":null,"request_id":"$request_id"}}';
}
