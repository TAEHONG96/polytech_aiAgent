    client_max_body_size 128k;
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $api http://api:8000;
    root /usr/share/nginx/html;

    location = /health { include /etc/nginx/polytech/proxy.conf; }
    location = /api/v1/ready { return 404; }
    location = /api/v1/auth/login {
        limit_req zone=signin burst=10 nodelay;
        limit_req_status 429;
        include /etc/nginx/polytech/proxy.conf;
    }
    location = /api/v1/sops {
        client_max_body_size 8m;
        include /etc/nginx/polytech/proxy.conf;
    }
    location /api/ { include /etc/nginx/polytech/proxy.conf; }
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
