services:
  api:
    command: ["python", "-m", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./main.py:/app/main.py:ro
      - ./app:/app/app:ro
  frontend:
    build:
      context: ./frontend
      target: development
    environment:
      VITE_PUBLIC_DEMO: ${VITE_PUBLIC_DEMO:-false}
    volumes:
      - ./frontend/src:/web/src:ro
      - ./frontend/index.html:/web/index.html:ro
    networks: [web]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 20
  nginx:
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    depends_on:
      frontend:
        condition: service_healthy
